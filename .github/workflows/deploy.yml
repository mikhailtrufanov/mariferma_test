name: Deploy website to ver.hmedia.pro

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build shared page elements
        run: node build-site.mjs

      - name: Check pages and local links
        run: node check-site.mjs

      - name: Deploy website via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /
          local-dir: ./
          exclude: |
            **/.git/**
            **/.github/**
            **/*.ARW
            **/*.arw
            **/.DS_Store
            **/*.txt
            **/*.md
            **/*.mjs
            **/*.template.html
            **/index-before-lazy.html
